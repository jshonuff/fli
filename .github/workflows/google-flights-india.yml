name: Google Flights India (FLI)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/google-flights-india.yml'
permissions:
  contents: read
jobs:
  flight-search:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout FLI
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install repository FLI
        run: python -m pip install . click
      - name: Search Google Flights MCI to DEL Jan 13-20
        shell: bash
        run: |
          set -o pipefail
          fli flights MCI DEL 2027-01-13 --return 2027-01-20 --sort CHEAPEST --format json 2>&1 | tee google_flights_india_results.txt
      - name: Save search output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: google-flights-india-2027-01-13
          path: google_flights_india_results.txt
          if-no-files-found: warn
